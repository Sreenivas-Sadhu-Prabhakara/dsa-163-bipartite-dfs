<text x="56.0" y="571.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">DFS and BFS verdicts always agree — the theorem (no odd cycle) doesn't care how you</text>
